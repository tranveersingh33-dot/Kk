<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d9edff;font-family:Arial,sans-serif;color:#172334}
.top{background:#087c87;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:21px;font-weight:700}
.top button{background:#f16b60;color:#fff;border:0;border-radius:7px;padding:10px 22px;font-size:16px}
.wrap{max-width:720px;margin:12px auto;padding:0 10px}.notice{color:#183caa;font-weight:700;text-align:center;margin:10px 0}
.panel{border:2px solid #5796a7;border-radius:12px;background:#c7e2fb;padding:12px;margin-bottom:14px}
.selectrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 4px 14px}
select,input,textarea{font:inherit}select{padding:12px;border:2px solid #579b6a;border-radius:7px;background:#fff;min-width:0}
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.tile{text-align:center;min-width:0}.tile b{display:block;font-size:14px;margin-bottom:3px}.tile input{width:100%;min-width:0;height:25px;border:2px solid #c65b6b;border-radius:9px;background:#f7fbff;text-align:center;padding:1px;font-size:12px}
.tile.active input{border-color:#07833b;background:#e6ffe9}
.section-title{font-weight:700;color:#163f75;margin:12px 0 7px}
.hbrow{display:grid;grid-template-columns:42px repeat(10,minmax(0,1fr));gap:4px;align-items:center;margin:5px 0}
.hbrow .tag{font-weight:bold;color:#087b36}.hbrow input{width:100%;min-width:0;height:26px;border:2px solid #b45b68;border-radius:8px;text-align:center;background:#f8fbff}
.entrygrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
label{font-size:13px;font-weight:bold;color:#24537c;display:block;margin-bottom:4px}
.field{width:100%;padding:9px;border:2px solid #172334;background:#fff}
textarea{width:100%;min-height:120px;padding:10px;border:2px solid #24384a;border-radius:7px;resize:vertical;background:#f9fcff}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.action{background:#07833b;color:white;border:0;border-radius:7px;padding:11px 18px;font-weight:bold;box-shadow:0 2px 4px #888}
button.clear{background:#d93e50}button.blue{background:#1976b9}button.yellow{background:#ffbd08;color:#222;width:100%;padding:15px;font-weight:bold;border:0;border-radius:8px;margin:10px 0}
.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;border:1px solid #9bb7cb;border-radius:6px;padding:10px;min-height:42px;margin-top:8px}
.historyitem{background:#fff;border-radius:6px;padding:8px;margin:6px 0;overflow-wrap:anywhere}
.bottom{position:sticky;bottom:0;background:#087c87;color:#fff;display:flex;justify-content:space-around;gap:4px;padding:10px 4px;font-size:12px;text-align:center}
.bottom span{cursor:pointer}
@media(max-width:420px){.wrap{padding:0 7px}.panel{padding:8px}.board{gap:3px}.tile b{font-size:11px}.tile input{height:23px}.hbrow{grid-template-columns:32px repeat(10,minmax(0,1fr));gap:2px}.hbrow input{height:23px;font-size:11px}.hbrow .tag{font-size:12px}.selectrow{gap:7px}.selectrow select{padding:9px;font-size:13px}}
</style>
</head>
<body>
<header class="top"><span>Number Board</span><button onclick="saveAll()">Save</button></header>
<div class="wrap">
<div class="notice">इस पेज पर नंबर चुनें, सामान्य नोट लिखें और अपना बोर्ड सेव करें।</div>
<section class="panel">
<div class="selectrow">
<select id="category"><option>सामान्य सूची</option><option>सूची 1</option><option>सूची 2</option><option>अन्य</option></select>
<select id="view"><option>सामान्य बोर्ड</option><option>दृश्य 1</option><option>दृश्य 2</option></select>
</div>
<div class="board" id="board"></div>
<div class="section-title">A–J</div>
<div class="hbrow"><b class="tag">A.</b><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span></div>
<div class="hbrow" id="rowA"><b class="tag">H.</b></div>
<div class="hbrow"><b class="tag">B.</b><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span></div>
<div class="hbrow" id="rowB"><b class="tag">H.</b></div>

<div class="entrygrid">
<div><label for="type">नोट का प्रकार</label><select id="type" class="field"><option>सामान्य</option><option>व्यक्तिगत नोट</option><option>अन्य</option></select></div>
<div><label for="number">नंबर / शीर्षक</label><input id="number" class="field" placeholder="नंबर या शीर्षक"></div>
<div style="grid-column:1/-1"><label for="note">नोट लिखें</label><textarea id="note" placeholder="यहाँ सामान्य नोट लिखें..."></textarea></div>
</div>
<div class="buttons"><button class="action" onclick="addNote()">DONE</button><button class="action clear" onclick="clearInputs()">CLEAR</button><button class="action blue" onclick="saveAll()">SAVE BOARD</button></div>
<div class="section-title">नोट / परिणाम</div><div class="result" id="result">आपके सेव किए गए नोट यहाँ दिखाई देंगे।</div>
</section>
<button class="yellow" onclick="showHistory()">Board History</button>
<section class="panel" id="historyPanel"><div class="section-title">History</div><div id="history">अभी कोई हिस्ट्री नहीं है।</div><div class="buttons"><button class="action clear" onclick="clearHistory()">CLEAR HISTORY</button></div></section>
</div>
<nav class="bottom"><span onclick="window.scrollTo({top:0,behavior:'smooth'})">Board</span><span onclick="document.getElementById('note').focus()">Notes</span><span onclick="showHistory()">History</span><span onclick="clearInputs()">Clear</span></nav>
<script>
const board=document.getElementById('board');
for(let n=1;n<=100;n++){const d=document.createElement('div');d.className='tile';d.dataset.n=n;d.innerHTML='<b>'+String(n).padStart(2,'0')+'</b><input aria-label="नंबर '+n+' का नोट" maxlength="10">';d.addEventListener('click',e=>{if(e.target.tagName!=='INPUT')d.classList.toggle('active')});board.appendChild(d)}
for(const id of ['rowA','rowB'])for(let i=0;i<10;i++){const inp=document.createElement('input');inp.maxLength=8;inp.setAttribute('aria-label',id+' '+i);document.getElementById(id).appendChild(inp)}
let notes=[];
function addNote(){const title=document.getElementById('number').value.trim();const note=document.getElementById('note').value.trim();if(!title&&!note){alert('पहले नंबर/शीर्षक या नोट लिखें।');return}const item={type:document.getElementById('type').value,title,note,when:new Date().toLocaleString()};notes.unshift(item);renderNotes();clearInputs(false);saveAll(false)}
function renderNotes(){const out=document.getElementById('result');out.textContent=notes.length?notes.map(x=>(x.title?x.title+' — ':'')+x.note+' ('+x.type+')').join('\n'):'आपके सेव किए गए नोट यहाँ दिखाई देंगे।';const h=document.getElementById('history');h.textContent='';if(!notes.length)h.textContent='अभी कोई हिस्ट्री नहीं है।';else notes.forEach(x=>{const d=document.createElement('div');d.className='historyitem';d.textContent=(x.title?x.title+' — ':'')+x.note+' | '+x.type+' | '+x.when;h.appendChild(d)})}
function clearInputs(clearResult=true){document.getElementById('number').value='';document.getElementById('note').value='';if(clearResult)document.getElementById('result').textContent='इनपुट साफ़ कर दिया गया।'}
function saveAll(show=true){const data={cells:[...board.children].map(c=>({value:c.querySelector('input').value,active:c.classList.contains('active')})),a:[...document.querySelectorAll('#rowA input')].map(x=>x.value),b:[...document.querySelectorAll('#rowB input')].map(x=>x.value),notes,category:document.getElementById('category').value,view:document.getElementById('view').value};try{localStorage.setItem('simpleNumberBoard',JSON.stringify(data));if(show)alert('बोर्ड सेव हो गया।')}catch(e){if(show)alert('इस ब्राउज़र में सेव नहीं हो पाया।')}}
function loadAll(){try{const d=JSON.parse(localStorage.getItem('simpleNumberBoard')||'null');if(!d)return;d.cells?.forEach((x,i)=>{if(board.children[i]){board.children[i].querySelector('input').value=x.value||'';board.children[i].classList.toggle('active',!!x.active)}});['a','b'].forEach(k=>{(d[k]||[]).forEach((v,i)=>{const el=document.querySelectorAll('#row'+k.toUpperCase()+' input')[i];if(el)el.value=v})});notes=d.notes||[];document.getElementById('category').value=d.category||'सामान्य सूची';document.getElementById('view').value=d.view||'सामान्य बोर्ड';renderNotes()}catch(e){}}
function clearHistory(){if(!confirm('सभी नोट्स की हिस्ट्री साफ़ करें?'))return;notes=[];renderNotes();saveAll(false)}
function showHistory(){document.getElementById('historyPanel').scrollIntoView({behavior:'smooth'})}
loadAll();
</script>
</body>
</html>
