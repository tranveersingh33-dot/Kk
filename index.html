<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Total Calculator</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  padding: 15px;
  margin: 0;
}
.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 2px 10px #ccc;
}
h2 { text-align: center; color: #123b68; }
textarea {
  width: 100%;
  height: 310px;
  box-sizing: border-box;
  padding: 12px;
  font-size: 15px;
  border: 1px solid #aaa;
  border-radius: 8px;
}
button {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: none;
  border-radius: 7px;
  font-size: 17px;
  color: white;
  background: #1769aa;
}
.result {
  background: #e8f5e9;
  padding: 12px;
  border-radius: 8px;
  margin-top: 15px;
  overflow-wrap: anywhere;
}
.line { border-bottom: 1px solid #ddd; padding: 8px 0; }
.total { font-size: 22px; font-weight: bold; color: #08752c; }
</style>
</head>
