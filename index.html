
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jantri Ledger</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #ededed;
}
header {
  background: #03072f;
  color: white;
  padding: 20px;
  display: flex;
  justify-content: space-between;
}
button {
  border: none;
  padding: 12px;
  margin: 4px;
  cursor: pointer;
  border-radius: 20px;
  font-weight: bold;
}
.menu {
  background: #16bf00;
  color: white;
  width: 100%;
}
.card {
  background: white;
  margin: 12px;
  padding: 14px;
  border-radius: 8px;
}
input, textarea {
  width: 95%;
  padding: 10px;
  margin: 5px 0;
}
.hidden { display: none; }
</style>
</head>
<body>

<header>
  <b>Jantri Ledger</b>
  <b id="total">POINTS: 0</b>
</header>

<div class="card">
  <button onclick="toggleMenu()">MORE / LESS</button>
  <button onclick="deleteAll()">DELETE ALL</button>
  <button onclick="shareLedger()">SEND TO</button>
  <div id="menu" class="hidden">
    <button class="menu" onclick="show('board')">JANTRI BOARD</button>
    <button class="menu" onclick="show('final')">FINAL JANTRI</button>
    <button class="menu" onclick="show('message')">MESSAGE COPY</button>
    <button class="menu" onclick="show('jodi')">JODI PASTE</button>
  </div>
</div>

<div class="card">
  <input id="number" placeholder="Number">
  <input id="points" type="number" placeholder="Points">
  <button onclick="addEntry()">ADD ENTRY</button>
</div>

<div id="records"></div>

<div class="card hidden" id="board">
  <h3>JANTRI BOARD</h3>
  <input id="start" value="00">
  <input id="end" value="99">
  <button onclick="makeBoard()">CREATE BOARD</button>
  <div id="boardResult"></div>
</div>

<div class="card hidden" id="final">
  <h3>FINAL JANTRI</h3>
  <button onclick="makeFinal()">CALCULATE TOTAL</button>
  <pre id="finalResult"></pre>
</div>

<div class="card hidden" id="message">
  <h3>MESSAGE COPY / FIND & REPLACE</h3>
  <textarea id="msg" placeholder="Paste message"></textarea>
  <input id="find" placeholder="Find text or symbol">
  <input id="replace" placeholder="Replace with">
  <button onclick="replaceText()">FIND & REPLACE</button>
  <button onclick="removeSymbols()">REMOVE SYMBOLS</button>
  <button onclick="copyMessage()">COPY RESULT</button>
  <textarea id="result"></textarea>
</div>

<div class="card hidden" id="jodi">
  <h3>JODI PASTE</h3>
  <textarea id="jodiInput" placeholder="Paste jodi numbers"></textarea>
  <button onclick="extractJodi()">EXTRACT JODI</button>
  <textarea id="jodiResult"></textarea>
  <button onclick="copyJodi()">COPY JODI</button>
</div>

<script>
let entries = [];

function toggleMenu() {
  document.getElementById("menu").classList.toggle("hidden");
}

function show(id) {
  ["board","final","message","jodi"].forEach(x =>
    document.getElementById(x).classList.add("hidden")
  );
  document.getElementById(id).classList.remove("hidden");
}

function addEntry() {
  let number = document.getElementById("number").value.trim();
  let points = document.getElementById("points").value;

  if (!number || points === "") {
    alert("Enter number and points");
    return;
  }

  entries.push({number, points: Number(points)});
  render();
  document.getElementById("number").value = "";
  document.getElementById("points").value = "";
}

function render() {
  let total = 0;
  let html = "";

  entries.forEach((e, i) => {
    total += e.points;
    html += `<div class="card">
      ${e.number} — ${e.points}
      <button onclick="editEntry(${i})">EDIT</button>
      <button onclick="deleteEntry(${i})">DELETE</button>
    </div>`;
  });

  document.getElementById("records").innerHTML = html;
  document.getElementById("total").textContent = "POINTS: " + total;
}

function editEntry(i) {
  document.getElementById("number").value = entries[i].number;
  document.getElementById("points").value = entries[i].points;
  entries.splice(i, 1);
  render();
}

function deleteEntry(i) {
  entries.splice(i, 1);
  render();
}

function deleteAll() {
  if (confirm("Delete all entries?")) {
    entries = [];
    render();
  }
}

function makeBoard() {
  let a = Number(document.getElementById("start").value);
  let b = Number(document.getElementById("end").value);
  if (b < a || b-a > 999) return alert("Invalid range");

  let list = [];
  for (let i=a; i<=b; i++) {
    list.push(String(i).padStart(2,"0"));
  }
  document.getElementById("boardResult").textContent =
    list.join(" ");
}

function makeFinal() {
  let totals = {};
  entries.forEach(e => {
    totals[e.number] = (totals[e.number] || 0) + e.points;
  });
  document.getElementById("finalResult").textContent =
    Object.entries(totals).map(([n,p]) => n + " = " + p).join("\n");
}

function replaceText() {
  let text = document.getElementById("msg").value;
  let find = document.getElementById("find").value;
  let replace = document.getElementById("replace").value;

  if (!find) return alert("Enter find text");
  document.getElementById("result").value =
    text.split(find).join(replace);
}

function removeSymbols() {
  document.getElementById("result").value =
    document.getElementById("msg").value
    .replace(/[()[\]{}.,/\\:;=_#-]+/g, " ")
    .replace(/\s+/g, " ").trim();
}

function extractJodi() {
  let text = document.getElementById("jodiInput").value;
  document.getElementById("jodiResult").value =
    (text.match(/(?<!\d)\d{2}(?!\d)/g) || []).join(" ");
}

function copyText(text) {
  navigator.clipboard.writeText(text)
    .then(() => alert("Copied"))
    .catch(() => prompt("Copy text:", text));
}

function copyMessage() {
  copyText(document.getElementById("result").value);
}

function copyJodi() {
  copyText(document.getElementById("jodiResult").value);
}

function shareLedger() {
  let text = entries.map(e => e.number + " = " + e.points).join("\n");
  if (navigator.share) navigator.share({text});
  else copyText(text);
}
</script>
</body>
</html>
