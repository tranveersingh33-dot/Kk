
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jantri Calculator</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f3f5;
  padding: 15px;
}
textarea, button {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  box-sizing: border-box;
  font-size: 16px;
}
textarea { min-height: 150px; }
button {
  background: #087f23;
  color: white;
  border: none;
  border-radius: 6px;
}
#output {
  background: white;
  white-space: pre-wrap;
  padding: 12px;
}
</style>
</head>
<body>

<h2>Jantri Bracket Calculator</h2>

<textarea id="message"
placeholder="WhatsApp message yahan paste karein"></textarea>

<button onclick="calculate(">CALCULATED / TOTAL</button>
<button onclick="copyResult(">COPY RESULT</button>
<button onclick="clearAll(">CLEAR</button>

<h3>Calculation Result</h3>
<div id="output"></div>

<script>
function calculate() {
  const text = document.getElementById("message").value;
  const output = document.getElementById("output");

  let total = 0;
  let groups = 0;
  const results = [];

  // Har bracket ke pehle wala number group padhein.
  const regex = /([^()]*?)\(\s*(\d+)\s*\)?/g;
  let match;

  while ((match = regex.exec(text)) !== null) {
    const before = match[1];

    // Comma, dot, slash aur space se numbers alag honge.
    const numbers = before.match(/\d+/g) || [];
    if (numbers.length === 0) continue;

    const multiplier = Number(match[2]);
    const count = numbers.length;
    const result = count * multiplier;

    total += result;
    groups++;

    results.push(
      numbers.join(", ") + " : " +
      count + " × " + multiplier + " = " + result
    );
  }

  if (groups === 0) {
    output.textContent =
      "Bracket format nahi mila. Example: 23,45.67(10";
    return;
  }

  results.push("--------------------");
  results.push("GROUPS = " + groups);
  results.push("GRAND TOTAL = " + total);

  output.textContent = results.join("\n");
}

function copyResult() {
  const text = document.getElementById("output").innerText;
  if (!text) return alert("Pehle calculate karein.");

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(() => alert("Result copied"))
      .catch(() => prompt("Result copy karein:", text));
  } else {
    prompt("Result copy karein:", text);
  }
}

function clearAll() {
  document.getElementById("message").value = "";
  document.getElementById("output").textContent = "";
}
</script>

</body>
</html>
