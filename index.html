<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jantri Ledger</title>
<style>
:root{--blue:#1769e0;--navy:#14243a;--bg:#f2f5fa;--green:#16b900;--red:#c62828}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#172033}
#loginScreen{position:fixed;inset:0;z-index:10;background:#03052f;color:#fff;min-height:100dvh;padding:24px;display:flex;align-items:stretch;justify-content:center}
.login{position:relative;width:100%;max-width:700px;background:transparent!important;box-shadow:none!important;border-radius:0!important;padding:0!important;text-align:center;display:flex;flex-direction:column;align-items:center}
.login .brand{margin:auto 0 0;color:#16c900;font-family:'Arial Narrow',Arial,sans-serif;font-size:clamp(52px,13vw,100px);font-weight:300;letter-spacing:-4px;line-height:1}
.login .dice{width:clamp(210px,55vw,360px);line-height:1;color:#16c900;margin-top:8vh}.login .dice svg{display:block;width:100%;height:auto;overflow:visible}
.login .login-bottom{width:100%;margin-top:auto;margin-bottom:7vh}.login .brand{font-family:'Arial Narrow',Impact,sans-serif;font-stretch:condensed;transform:scaleX(.82);}
.login input{height:72px;text-align:left;letter-spacing:1px;font-size:28px;border:0;border-radius:24px;padding:0 16px;color:#333}
.login .actions{margin-top:22px}
.login .actions button{height:72px;border-radius:24px;background:#16b900;font-size:23px}
.login h2,.login p{display:none}
#loginError{color:#ff7777;margin-top:10px}
#app header{background:#03052f}

header{background:var(--navy);color:#fff;padding:16px;text-align:center}
header h1{margin:0;font-size:22px} header p{margin:6px 0 0;color:#d7e3f5;font-size:13px}
main{max-width:900px;margin:0 auto;padding:14px}
.panel{background:#fff;border-radius:12px;padding:15px;margin:0 0 14px;box-shadow:0 2px 9px #17203312}
h2{font-size:18px;margin:0 0 12px}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 6px}
textarea,input{width:100%;padding:12px;border:1px solid #cbd4e1;border-radius:8px;font:16px Arial;background:#fff;color:#172033}
textarea{min-height:125px;resize:vertical}
button{border:0;border-radius:8px;padding:11px 13px;background:var(--blue);color:white;font-size:14px;font-weight:700;cursor:pointer}
button.secondary{background:#e7edf6;color:#172033}
button.green{background:var(--green)} button.red{background:var(--red)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.actions button{flex:1 1 110px}
.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f9fc;border:1px solid #e0e6ef;border-radius:8px;padding:12px;min-height:44px}
.total{font-size:24px;font-weight:800;color:var(--green)}
.small{font-size:12px;color:#64748b;line-height:1.5}
.error{color:var(--red);min-height:18px;font-size:13px}
#app{display:none}
.login-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center}
.login{width:100%;max-width:380px;text-align:center}
.login input{text-align:center;letter-spacing:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}main{padding:10px}.panel{padding:12px}}
</style>
</head>
<body>
<header><h1>Jantri Ledger</h1><p>Board • Message Cleaner • Group Calculator</p></header>

<main>
<section id="loginScreen" class="login-wrap">
  <div class="login">
    <div class="dice" aria-label="Green dice logo">
      <svg viewBox="0 0 360 300" role="img" aria-label="Two green dice" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#16c900" stroke-width="5" stroke-linejoin="round">
          <path fill="#16c900" d="M65 54 Q70 35 94 30 L185 12 Q201 10 214 20 L266 42 Q278 48 278 65 L278 155 Q278 173 262 181 L180 218 Q164 224 149 216 L75 184 Q61 178 61 160 L61 72 Q61 59 65 54Z"/>
          <path fill="#16c900" d="M61 72 L149 100 L149 216 Q132 214 118 208 L75 184 Q61 178 61 160Z"/>
          <path fill="#16c900" d="M149 100 L278 65 L278 155 Q278 173 262 181 L180 218 Q164 224 149 216Z"/>
          <path fill="#16c900" d="M65 54 L154 79 L278 48 L214 20 Q201 10 185 12 L94 30 Q70 35 65 54Z"/>
          <path fill="#16c900" d="M202 160 L260 140 Q276 136 291 145 L335 168 Q349 176 349 193 L349 259 Q349 276 333 283 L278 300 Q263 305 249 296 L207 273 Q195 267 195 251 L195 179 Q195 166 202 160Z" transform="translate(-12,-8) scale(.93)"/>
        </g>
        <g fill="#03052f">
          <ellipse cx="110" cy="53" rx="9" ry="5" transform="rotate(-8 110 53)"/><ellipse cx="173" cy="45" rx="9" ry="5"/><ellipse cx="199" cy="68" rx="8" ry="5"/>
          <ellipse cx="88" cy="96" rx="7" ry="11"/><ellipse cx="88" cy="128" rx="7" ry="11"/><ellipse cx="88" cy="158" rx="7" ry="11"/>
          <ellipse cx="132" cy="111" rx="7" ry="11"/><ellipse cx="132" cy="143" rx="7" ry="11"/><ellipse cx="132" cy="174" rx="7" ry="11"/>
          <ellipse cx="232" cy="93" rx="7" ry="11"/><ellipse cx="215" cy="127" rx="7" ry="11"/>
          <ellipse cx="246" cy="207" rx="7" ry="10"/><ellipse cx="276" cy="190" rx="7" ry="10"/><ellipse cx="306" cy="207" rx="7" ry="10"/>
          <ellipse cx="245" cy="246" rx="7" ry="10"/><ellipse cx="306" cy="246" rx="7" ry="10"/><ellipse cx="276" cy="226" rx="7" ry="10"/>
        </g>
      </svg>
    </div>
    <div class="brand">LEDGER</div>
    <div class="login-bottom">
      <input id="password" type="password" inputmode="numeric" placeholder="Passcode" autocomplete="current-password" aria-label="Passcode">
      <div class="actions"><button onclick="login()">PROCEED</button></div>
      <div id="loginError" class="error" aria-live="polite"></div>
    </div>
  </div>
</section>

<div id="app">
  <section class="panel">
    <h2>📋 Jantri Board</h2>
    <label for="boardInput">मैसेज यहाँ पेस्ट करें</label>
    <textarea id="boardInput" placeholder="उदाहरण: 23,45,67(10) 11(40) 66(55) 30(20)"></textarea>
    <div class="actions">
      <button onclick="pasteText()">Paste</button>
      <button class="green" onclick="submitBoard()">Submit / Calculate</button>
      <button class="secondary" onclick="clearBoard()">Close / Clear</button>
    </div>
    <p class="small">नोट: ब्रैकेट से पहले के नंबर उस ब्रैकेट की वैल्यू से गुणा होंगे। WP होने पर वैल्यू दोगुनी होगी।</p>
  </section>

  <section class="panel">
    <h2>🧹 Message Copy / Find & Replace</h2>
    <label for="cleanInput">टेक्स्ट साफ करने के लिए</label>
    <textarea id="cleanInput" placeholder="यहाँ टेक्स्ट डालें या Board से लाएँ"></textarea>
    <div class="row">
      <div><label for="findText">Find (खोजें)</label><input id="findText" placeholder="खोजने वाला टेक्स्ट"></div>
      <div><label for="replaceText">Replace (बदलें)</label><input id="replaceText" placeholder="नया टेक्स्ट (खाली भी छोड़ सकते हैं)"></div>
    </div>
    <div class="actions">
      <button onclick="cleanText()">Clean Text</button>
      <button class="secondary" onclick="doReplace()">Find & Replace</button>
      <button class="green" onclick="copyClean()">Copy Message</button>
      <button class="secondary" onclick="useCleanForCalc()">Calculate This</button>
    </div>
    <div id="cleanStatus" class="small" aria-live="polite"></div>
  </section>

  <section class="panel">
    <h2>🧮 Calculated Groups</h2>
    <div id="groupResults" class="result">अभी कोई हिसाब नहीं हुआ है।</div>
    <label>Total</label>
    <div id="grandTotal" class="total">0</div>
    <div class="actions">
      <button class="green" onclick="copyResults()">Copy Result</button>
      <button class="secondary" onclick="clearResults()">Clear Result</button>
    </div>
  </section>
</div>
</main>

<script>
const $ = id => document.getElementById(id);

function login(){
  if($('password').value === '9999'){
    $('loginScreen').style.display='none';
    $('app').style.display='block';
    $('loginError').textContent='';
  } else {
    $('loginError').textContent='गलत पासवर्ड। फिर कोशिश करें।';
    $('password').select();
  }
}
$('password').addEventListener('keydown', e => { if(e.key==='Enter') login(); });

async function pasteText(){
  try{
    if(!navigator.clipboard || !navigator.clipboard.readText()) throw new Error('clipboard');
    const t=await navigator.clipboard.readText();
    $('boardInput').value=t;
    $('cleanInput').value=t;
  }catch(e){
    $('boardInput').focus();
    $('cleanStatus').textContent='Clipboard access उपलब्ध नहीं है। टेक्स्ट बॉक्स को दबाकर Paste चुनें।';
  }
}
function submitBoard(){
  const text=$('boardInput').value.trim();
  $('cleanInput').value=text;
  calculate(text);
}
function clearBoard(){
  $('boardInput').value='';
  $('cleanInput').value='';
  $('cleanStatus').textContent='';
  clearResults();
}
function cleanText(){
  const text=$('cleanInput').value;
  // Keep digits, spaces and common separators used between number groups.
  $('cleanInput').value=text
    .replace(/[()[\]{}<>]/g,' ')
    .replace(/[,:;./\\|#%@!$^&=+_*"'`~–—-]+/g,' ')
    .replace(/\b(into|intu|wp|plt)\b/gi, m => m.toLowerCase())
    .replace(/[ \t]+/g,' ')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
  $('cleanStatus').textContent='टेक्स्ट साफ कर दिया गया है।';
}
function doReplace(){
  const find=$('findText').value;
  if(!find){$('cleanStatus').textContent='पहले Find में टेक्स्ट लिखें।';return;}
  const escaped=find.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp(escaped,'gi');
  const before=$('cleanInput').value;
  $('cleanInput').value=before.replace(re,$('replaceText').value);
  $('cleanStatus').textContent='Find & Replace पूरा हुआ।';
}
async function copyClean(){
  const text=$('cleanInput').value;
  try{await navigator.clipboard.writeText(text);$('cleanStatus').textContent='Message copy हो गया।';}
  catch(e){fallbackCopy(text);$('cleanStatus').textContent='कॉपी करने के लिए टेक्स्ट चुना गया है; Copy चुनें।';}
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch(e){} ta.remove();
}
function useCleanForCalc(){ $('boardInput').value=$('cleanInput').value; calculate($('cleanInput').value); }

// Convert an unseparated digit run into two-digit number pairs, e.g. 2345 -> 23,45.
function extractNumbers(segment){
  const chunks=segment.match(/\d+/g)||[];
  const result=[];
  for(const chunk of chunks){
    if(chunk.length>2){
      let i=0;
      while(i+1<chunk.length){result.push(Number(chunk.slice(i,i+2)));i+=2;}
      if(i<chunk.length) result.push(Number(chunk.slice(i)));
    } else result.push(Number(chunk));
  }
  return result;
}
function calculate(text){
  const source=String(text||'');
  // हर multiplier marker अलग group है: (10), (10, (10)wp, into 10, intu 10 आदि।
  const markerRe=/\(\s*(\d+(?:\.\d+)?)\s*\)?\s*(?:with\s+)?(wp|plt)?|\b(?:into|intu)\s*[:=]?\s*(\d+(?:\.\d+)?)\s*(?:with\s+)?(wp|plt)?/gi;
  const markers=[...source.matchAll(markerRe)];
  const groups=[];
  let cursor=0,total=0;
  for(const m of markers){
    // केवल पिछले marker के बाद से इस marker से पहले तक के नंबर इस group में गिने जाएँ।
    const segment=source.slice(cursor,m.index);
    let value=Number(m[1]||m[3]);
    const suffix=(m[2]||m[4]||'').toLowerCase();
    if(suffix==='wp'||suffix==='plt') value*=2;
    const nums=extractNumbers(segment);
    if(nums.length){
      const count=nums.length;
      const amount=count*value;
      groups.push({nums,value,count,amount});
      total+=amount;
    }
    cursor=m.index+m[0].length;
  }
  if(!groups.length){
    $('groupResults').textContent='कोई bracket या into/intu multiplier नहीं मिला। उदाहरण: 23,45(10) 67,89(20) या 23,45 into 10 67,89 intu 20';
    $('grandTotal').textContent='0';
    window.lastLedgerResult='';
    return;
  }
  $('groupResults').textContent=groups.map((g,i)=>
    `${i+1}. ${g.nums.join(', ')} → ${g.count} × ${g.value} = ${g.amount}`
  ).join('\n')+'\n\nकुल समूह: '+groups.length;
  $('grandTotal').textContent=Number.isInteger(total)?total.toLocaleString('en-IN'):total.toLocaleString('en-IN',{maximumFractionDigits:2});
  window.lastLedgerResult=groups.map((g,i)=>`${i+1}. ${g.count} × ${g.value} = ${g.amount}`).join('\n')+'\nTotal = '+total;
}
function copyResults(){
  const text=(window.lastLedgerResult||$('groupResults').textContent)+'\nTotal = '+$('grandTotal').textContent;
  try{navigator.clipboard.writeText(text).then(()=>{}).catch(()=>fallbackCopy(text));}
  catch(e){fallbackCopy(text);}
}
function clearResults(){
  $('groupResults').textContent='अभी कोई हिसाब नहीं हुआ है।';
  $('grandTotal').textContent='0';
  window.lastLedgerResult='';
}
</script>
</body>
</html>
