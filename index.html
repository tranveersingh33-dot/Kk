<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Lock Passcode</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .lock-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 18px;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="lock-container">
        <h2>Enter Screen Lock Passcode</h2>
        <input type="password" id="passcode" maxlength="4" placeholder="Enter 4-digit PIN (1988)">
        <button onclick="checkPasscode()">Unlock</button>
    </div>

    <script>
        function checkPasscode() {
            var enteredPass = document.getElementById('passcode').value.trim();
            if (enteredPass === "1988") {
                alert("Access Granted!");
                // Yahan aap agle page par redirect karne ka code likh sakte hain
            } else {
                alert("Incorrect Password! Try 1988");
                document.getElementById('passcode').value = "";
            }
        }
    </script>

</body>
</html>
