<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KK App</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f7;color:#172033}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#06183f,#174a83)}
.login-card{width:min(100%,380px);background:#fff;border-radius:18px;padding:28px;box-shadow:0 18px 45px #0004}
.logo{width:62px;height:62px;border-radius:16px;background:#06183f;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:bold;margin:0 auto 14px}
h1{text-align:center;margin:0 0 6px;color:#06183f} .muted{text-align:center;color:#667085;margin:0 0 24px;font-size:14px}
label{display:block;font-weight:600;margin:14px 0 7px}
input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;outline:none}
input:focus{border-color:#1769aa;box-shadow:0 0 0 3px #1769aa22}
button{border:0;border-radius:9px;padding:13px 16px;background:#078b2c;color:white;font-weight:bold;font-size:16px;cursor:pointer}
.login-card button{width:100%;margin-top:20px}
#error{color:#c62828;text-align:center;min-height:20px;margin:12px 0 0;font-size:14px}
#app{display:none;min-height:100vh}.top{background:#06183f;color:white;padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.top h2{margin:0;font-size:21px}.logout{background:#d64545;padding:9px 13px;font-size:14px}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px;background:#fff;box-shadow:0 2px 8px #0001}
nav button{background:#1769aa;font-size:14px;padding:10px 13px}
main{padding:18px;max-width:1000px;margin:auto}.panel{background:white;border-radius:13px;padding:20px;box-shadow:0 3px 12px #14213d12;margin-bottom:15px}
.panel h3{margin:0 0 12px;color:#06183f}.hidden{display:none}
.stat{font-size:28px;font-weight:bold;color:#078b2c}
table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e5eaf0;text-align:left}
.small{font-size:13px;color:#667085}
</style>
</head>
<body>
<section class="login-wrap" id="login">
  <div class="login-card">
    <div class="logo">KK</div>
    <h1>KK APP LOGIN</h1>
    <p class="muted">आगे बढ़ने के लिए लॉगिन करें</p>
    <form id="loginForm">
      <label for="username">Login</label>
      <input id="username" autocomplete="username" placeholder="यूज़रनेम" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="पासवर्ड" required>
      <button type="submit">LOGIN</button>
      <p id="error" role="alert"></p>
    </form>
  </div>
</section>

<section id="app">
  <header class="top">
    <h2>KK APP</h2>
    <button class="logout" id="logoutBtn">LOGOUT</button>
  </header>
  <nav>
    <button data-page="home">HOME</button>
    <button data-page="chart">CHART</button>
    <button data-page="history">HISTORY</button>
  </nav>
  <main>
    <section class="panel page" id="home">
      <h3>Welcome</h3>
      <p>आप सफलतापूर्वक लॉगिन हो गए हैं।</p>
      <p class="small">यह एक सामान्य डेमो डैशबोर्ड है।</p>
    </section>
    <section class="panel page hidden" id="chart">
      <h3>Chart</h3>
      <p>यहाँ आप सामान्य डेटा या रिपोर्ट का चार्ट जोड़ सकते हैं।</p>
      <div class="stat">0</div>
      <p class="small">अभी कोई डेटा उपलब्ध नहीं है।</p>
    </section>
    <section class="panel page hidden" id="history">
      <h3>History</h3>
      <table><thead><tr><th>क्रम</th><th>विवरण</th><th>स्थिति</th></tr></thead>
      <tbody><tr><td>1</td><td>ऐप लॉगिन</td><td>तैयार</td></tr></tbody></table>
    </section>
  </main>
</section>

<script>
const USERNAME = "KK";
const PASSWORD = "8947";

const login = document.getElementById("login");
const app = document.getElementById("app");
const error = document.getElementById("error");

document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value;
  if(user === USERNAME && pass === PASSWORD){
    error.textContent = "";
    login.style.display = "none";
    app.style.display = "block";
    showPage("home");
  } else {
    error.textContent = "यूज़रनेम या पासवर्ड गलत है।";
  }
});

function showPage(page){
  document.querySelectorAll(".page").forEach(el => el.classList.add("hidden"));
  const target = document.getElementById(page);
  if(target) target.classList.remove("hidden");
}
document.querySelectorAll("nav button").forEach(btn => {
  btn.addEventListener("click", () => showPage(btn.dataset.page));
});
document.getElementById("logoutBtn").addEventListener("click", () => {
  app.style.display = "none";
  login.style.display = "grid";
  document.getElementById("password").value = "";
});
</script>
</body>
</html>
