
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jantri Bracket Calculator</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  margin: 0;
  padding: 15px;
}
.container {
  max-width: 650px;
  margin: auto;
}
h2 { color: #061b49; }
textarea {
  width: 100%;
  min-height: 140px;
  padding: 12px;
  box-sizing: border-box;
  border: 1px solid #bbb;
  border-radius: 8px;
  font-size: 16px;
  margin-bottom: 10px;
}
button {
  padding: 12px;
  border: none;
  border-radius: 7px;
  color: white;
  background: #07852b;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
  margin: 4px 0;
}
.buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}
.buttons button { flex: 1; }
.blue { background: #0868d7; }
.red { background: #dc2626; }
.result {
  background: white;
  border-radius: 8px;
  padding: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  min-height: 80px;
}
</style>
</head>
<body>
<div class="container">

<h2>Jantri Bracket Calculator</h2>

<label>WhatsApp message paste karein:</label>
<textarea id="message"
placeholder="Example:&#10;23,45,67(10wp&#10;12,34(5)wp&#10;55/66/77(20)"></textarea>

<div class="buttons">
<button onclick="calculate()">CALCULATED / TOTAL</button>
<button class="red" onclick="clearAll()">CLEAR</button>
</div>

<h3>Calculation Result</h3>
<div id="output" class="result">Result yahan aayega.</div>

<button class="blue" onclick="copyResult()">COPY RESULT</button>

<script>
function calculate() {
  const text = document.getElementById("message").value;
  const output = document.getElementById("output");

  let total = 0;
  let groupCount = 0;
  let results = [];

  /*
    Bracket examples:
    (10
    (10)
    ((10))
    (10wp
    (10)wp
    ((10))wp
  */

  const lines = text.split(/\r?\n/);

  for (const line of lines) {
    // Har bracket group ko alag process karein.
    const regex =
      /([^()]*?)\s*\({1,2}\s*(\d+)\s*\){0,2}\s*(wp)?/gi;

    let match;

    while ((match = regex.exec(line)) !== null) {
      const beforeBracket = match[1];
      const numbers = beforeBracket.match(/\d+/g) || [];

      if (numbers.length === 0) {
        if (match[0].length === 0) regex.lastIndex++;
        continue;
      }

      const count = numbers.length;
      const originalValue = Number(match[2]);
      const hasWP = Boolean(match[3]);

      // WP ke saath bracket value double hogi.
      const multiplier = hasWP
        ? originalValue * 2
        : originalValue;

      const answer = count * multiplier;
      total += answer;
      groupCount++;

      results.push(
        numbers.join(", ") +
        " | Count: " + count +
        " | Bracket: " + originalValue +
        (hasWP ? " | WP Double: " + multiplier : "") +
        " | " + count + " × " + multiplier +
        " = " + answer
      );

      if (match[0].length === 0) regex.lastIndex++;
    }
  }

  if (groupCount === 0) {
    output.textContent =
      "Bracket nahi mila. Example: 23,45,67(10wp";
    return;
  }

  results.push("----------------------------");
  results.push("TOTAL GROUPS = " + groupCount);
  results.push("GRAND TOTAL = " + total);

  output.textContent = results.join("\n");
}

function copyResult() {
  const text = document.getElementById("output").innerText;

  if (!text || text === "Result yahan aayega.") {
    alert("Pehle calculation karein.");
    return;
  }

  const area = document.createElement("textarea");
  area.value = text;
  document.body.appendChild(area);
  area.select();

  try {
    document.execCommand("copy");
    alert("Result copied!");
  } catch (e) {
    alert("Result ko manually copy karein.");
  }

  area.remove();
}

function clearAll() {
  document.getElementById("message").value = "";
  document.getElementById("output").textContent =
    "Result yahan aayega.";
}
</script>
</div>
</body>
</html>
