
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Calculator</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  padding: 15px;
}
.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
}
h2 { text-align: center; }
textarea, input, button {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 8px 0;
  font-size: 16px;
}
button {
  background: #1677ff;
  color: white;
  border: none;
  border-radius: 6px;
}
.result {
  background: #eaf3ff;
  padding: 12px;
  overflow-wrap: anywhere;
  margin-top: 10px;
}
</style>
</head>
<body>
<div class="container">
<h2>Number Calculator</h2>

<label>अपनी नंबर लिस्ट डालें:</label>
<textarea id="numbers" rows="5"
placeholder="23,47.25/32%63#78-63*64"></textarea>

<label>Bracket Value:</label>
<input id="value" type="number" value="10">

<button onclick="calculate()">Calculate Total</button>
<button onclick="copyResult()">Copy Result</button>

<div class="result">
<b>Number List:</b>
<p id="list"></p>
<b>Total:</b>
<p id="total">0</p>
</div>
</div>

<script>
function calculate() {
  let input = document.getElementById("numbers").value;
  let value = Number(document.getElementById("value").value);

  // सभी सिंबल हटाकर नंबर निकालें
  let numbers = input.match(/\d+/g) || [];

  // हर नंबर के साथ bracket value लगाएं
  let result = numbers.map(n => n + "(" + value + ")");

  document.getElementById("list").textContent =
    result.join(" ");

  document.getElementById("total").textContent =
    numbers.length * value;
}

function copyResult() {
  let list = document.getElementById("list").textContent;
  let total = document.getElementById("total").textContent;
  let text = list + "\nTotal = " + total;

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text);
  } else {
    let area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
}
</script>
</body>
</html>
