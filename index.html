<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGER Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #00052f;
  color: white;
}

.app {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 20px 24px 65px;
}

.logo {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-bottom: 25px;
}

.dice {
  width: min(75vw, 350px);
  height: auto;
  overflow: visible;
}

.brand {
  margin-top: 25px;
  color: #16d000;
  font-family: "Arial Narrow", "Trebuchet MS", sans-serif;
  font-size: clamp(55px, 15vw, 95px);
  font-weight: 300;
  letter-spacing: -4px;
  transform: scaleX(.82);
}

.login {
  width: 100%;
}

input {
  width: 100%;
  height: 72px;
  border: none;
  outline: none;
  border-radius: 25px;
  background: white;
  color: #111;
  padding: 0 15px;
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 23px;
}

input::placeholder {
  color: #666;
  opacity: 1;
}

button {
  width: 100%;
  height: 72px;
  border: none;
  border-radius: 25px;
  background: #16bd00;
  color: white;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  background: #119b00;
}

.message {
  text-align: center;
  font-size: 14px;
  margin-top: 12px;
  color: #fff;
}

@media (max-height: 650px) {
  .app { padding-top: 10px; }
  .dice { width: 200px; }
  .brand { font-size: 55px; margin-top: 10px; }
  input, button { height: 58px; }
}
</style>
</head>

<body>
<div class="app">

  <div class="logo">

    <!-- Dice Logo -->
    <svg class="dice" viewBox="0 0 350 300"
         xmlns="http://www.w3.org/2000/svg">

      <g stroke="#00052f" stroke-width="3"
         stroke-linejoin="round">

        <!-- Back dice top -->
        <path d="M35 55 L105 20 Q120 12 137 17
                 L195 29 Q213 34 218 49
                 L150 88 Z"
              fill="#16d000"/>

        <!-- Back dice left -->
        <path d="M35 55 Q30 58 30 75
                 L30 160 Q30 179 45 185
                 L105 205 Q120 210 121 192
                 L121 89 Z"
              fill="#16d000"/>

        <!-- Back dice right -->
        <path d="M121 89 L218 49
                 L218 139 Q218 155 204 163
                 L121 205 Z"
              fill="#16d000"/>

        <!-- Back top dots -->
        <g fill="#00052f" stroke="none">
          <ellipse cx="111" cy="33" rx="7" ry="4"/>
          <ellipse cx="137" cy="48" rx="7" ry="4"/>
        </g>

        <!-- Back left dots -->
        <g fill="#00052f" stroke="none">
          <ellipse cx="53" cy="78" rx="6" ry="9"/>
          <ellipse cx="53" cy="105" rx="6" ry="9"/>
          <ellipse cx="53" cy="132" rx="6" ry="9"/>
          <ellipse cx="91" cy="88" rx="6" ry="9"/>
          <ellipse cx="91" cy="116" rx="6" ry="9"/>
          <ellipse cx="91" cy="145" rx="6" ry="9"/>
        </g>

        <!-- Back right dots -->
        <g fill="#00052f" stroke="none">
          <ellipse cx="178" cy="72" rx="6" ry="9"/>
          <ellipse cx="160" cy="106" rx="6" ry="9"/>
          <ellipse cx="145" cy="143" rx="6" ry="9"/>
        </g>

        <!-- Front dice top -->
        <path d="M170 172 L240 146
                 Q255 141 270 147
                 L320 168 Q335 175 335 190
                 L264 222 Z"
              fill="#16d000"/>

        <!-- Front dice left -->
        <path d="M170 172 L264 222
                 L264 286 Q263 300 248 294
                 L185 267 Q170 261 170 243 Z"
              fill="#16d000"/>

        <!-- Front dice right -->
        <path d="M264 222 L335 190
                 L335 263 Q335 280 320 287
                 L264 300 Z"
              fill="#16d000"/>

        <!-- Front top dot -->
        <ellipse cx="268" cy="165" rx="7" ry="4"
                 fill="#00052f" stroke="none"/>

        <!-- Front left dots -->
        <g fill="#00052f" stroke="none">
          <ellipse cx="191" cy="193" rx="5" ry="8"/>
          <ellipse cx="213" cy="221" rx="6" ry="8"/>
          <ellipse cx="190" cy="248" rx="5" ry="8"/>
          <ellipse cx="235" cy="207" rx="5" ry="8"/>
          <ellipse cx="238" cy="263" rx="5" ry="8"/>
        </g>

        <!-- Front right dots -->
        <g fill="#00052f" stroke="none">
          <ellipse cx="285" cy="211" rx="6" ry="9"/>
          <ellipse cx="318" cy="198" rx="6" ry="9"/>
          <ellipse cx="285" cy="267" rx="6" ry="9"/>
          <ellipse cx="318" cy="254" rx="6" ry="9"/>
        </g>

      </g>
    </svg>

    <div class="brand">LEDGER</div>
  </div>

  <form class="login" id="loginForm">
    <input
      type="password"
      id="passcode"
      placeholder="Passcode"
      aria-label="Passcode"
      autocomplete="current-password"
      required
    >

    <button type="submit">PROCEED</button>

    <div class="message" id="message"></div>
  </form>

</div>

<script>
document.getElementById("loginForm")
  .addEventListener("submit", function(event) {
    event.preventDefault();

    const passcode =
      document.getElementById("passcode").value;

    if (!passcode.trim()) {
      document.getElementById("message").textContent =
        "Please enter passcode";
      return;
    }

    document.getElementById("message").textContent =
      "Demo screen only. Add secure authentication to login.";
  });
</script>
</body>
</html>
