
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jantri Ledger</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eee;
}
header {
  background: #03072f;
  color: white;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  font-weight: bold;
}
button {
  padding: 12px;
  border: none;
  border-radius: 20px;
  background: #16bf00;
  color: white;
  font-weight: bold;
  margin: 3px;
}
input, textarea {
  padding: 12px;
  width: 90%;
  margin: 5px 0;
}
.panel, .entrybox, .record {
  background: white;
  padding: 12px;
  margin: 12px;
  border-radius: 8px;
}
.panel { display: none; }
.row {
  display: flex;
  gap: 8px;
}
.row input { width: 50%; }
#records { margin-top: 10px; }
</style>
</head>
<body>

<header>
  <span>Jantri Ledger</span>
  <span id="total">POINTS: 0</span>
</header>

<div class="entrybox">
  <div class="row">
    <input id="number" placeholder="Number">
    <input id="points" type="number" placeholder="Points">
  </div>
  <button onclick="addEntry()">ADD ENTRY</button>
  <button onclick="clearFields()">CROSS</button>
</div>

<div class="entrybox">
  <button onclick="openPanel('paste')">PASTE MESSAGE</button>
  <button onclick="openPanel('board')">JANTRI BOARD</button>
  <button onclick="openPanel('final')">FINAL JANTRI</button>
  <button onclick="openPanel('copy')">MESSAGE COPY</button>
  <button onclick="deleteAll()">DELETE ALL</button>
</div>

<div id="records"></div>

<section id="paste" class="panel">
  <h3>Paste Message</h3>
  <textarea id="message" placeholder="23,45.67(10"></textarea>
  <button onclick="processMessage()">SUBMIT</button>
  <button onclick="closePanel('paste')">CLOSE</button>
  <div id="preview"></div>
</section>

<section id="board" class="panel">
  <h3>JANTRI BOARD</h3>
  <div id="boardResult"></div>
  <button onclick="closePanel('board')">CLOSE</button>
</section>

<section id="final" class="panel">
  <h3>FINAL JANTRI</h3>
  <div id="finalResult"></div>
  <button onclick="copyFinal()">COPY FINAL</button>
  <button onclick="closePanel('final')">CLOSE</button>
</section>

<section id="copy" class="panel">
  <h3>MESSAGE COPY / FIND & REPLACE</h3>
  <textarea id="copyText" placeholder="Message"></textarea>
  <input id="find" placeholder="Find text">
  <input id="replace" placeholder="Replace with">
  <button onclick="findReplace()">FIND & REPLACE</button>
  <button onclick="removeSymbols()">REMOVE SYMBOLS</button>
  <button onclick="copyMessage()">COPY</button>
  <button onclick="closePanel('copy')">CLOSE</button>
</section>

<script>
let entries = [];

try {
  entries = JSON.parse(localStorage.getItem('jantriEntries') || '[]');
  if (!Array.isArray(entries)) entries = [];
} catch(e) { entries = []; }

function save() {
  localStorage.setItem('jantriEntries', JSON.stringify(entries));
}

function render() {
  const records = document.getElementById('records');
  records.innerHTML = '';
  let total = 0;

  entries.forEach((e, i) => {
    total += Number(e.points) || 0;

    const row = document.createElement('div');
    row.className = 'record';
    row.textContent = e.number + ' — ' + e.points + ' points ';

    const del = document.createElement('button');
    del.textContent = 'DELETE';
    del.onclick = () => {
      entries.splice(i, 1);
      save();
      render();
    };

    row.appendChild(del);
    records.appendChild(row);
  });

  document.getElementById('total').textContent =
    'POINTS: ' + total;

  document.getElementById('finalResult').textContent =
    entries.map(e => e.number + ' = ' + e.points).join('\n') +
    '\nGrand Total: ' + total;
}

function addEntry() {
  const number = document.getElementById('number').value.trim();
  const points = document.getElementById('points').value;

  if (!number || points === '' || !Number.isFinite(Number(points))) {
    alert('Number aur Points bharein.');
    return;
  }

  entries.push({number, points: Number(points)});
  save();
  render();
  clearFields();
}

function clearFields() {
  document.getElementById('number').value = '';
  document.getElementById('points').value = '';
}

function deleteAll() {
  if (confirm('Sabhi entries delete karein?')) {
    entries = [];
    save();
    render();
  }
}

function openPanel(id) {
  document.querySelectorAll('.panel').forEach(
    p => p.style.display = 'none'
  );
  document.getElementById(id).style.display = 'block';

  if (id === 'board') {
    document.getElementById('boardResult').textContent =
      entries.map(e => e.number + ' (' + e.points + ')').join('\n');
  }
}

function closePanel(id) {
  document.getElementById(id).style.display = 'none';
}

function processMessage() {
  const text = document.getElementById('message').value;
  const groups = [];
  const lines = text.split(/\n/);

  lines.forEach(line => {
    const re = /([^()\n]*?)\(\s*(\d+(?:\.\d+)?)\s*\)/g;
    let match;

    while ((match = re.exec(line)) !== null) {
      const nums = match[1].match(/\d+/g) || [];
      if (!nums.length) continue;

      const amount = Number(match[2]);
      groups.push({
        nums,
        amount,
        total: nums.length * amount
      });
    }
  });

  if (!groups.length) {
    alert('Bracket wali line nahi mili.');
    return;
  }

  groups.forEach(g => {
    g.nums.forEach(n => entries.push({
      number: n,
      points: g.amount
    }));
  });

  document.getElementById('preview').textContent =
    groups.map(g => g.nums.join(',') + '(' + g.amount + ') = ' +
      g.nums.length + ' × ' + g.amount + ' = ' + g.total).join('\n');

  save();
  render();
  openPanel('board');
}

function findReplace() {
  const source = document.getElementById('copyText');
  const find = document.getElementById('find').value;

  if (!find) {
    alert('Find text bharein.');
    return;
  }

  source.value = source.value.split(find).join(
    document.getElementById('replace').value
  );
}

function removeSymbols() {
  const field = document.getElementById('copyText');
  field.value = field.value.replace(/[.,/\\'"_#@*%:;=+\-]+/g, ' ');
}

function copyMessage() {
  copyText(document.getElementById('copyText').value);
}

function copyFinal() {
  copyText(document.getElementById('finalResult').textContent);
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(() => alert('Copied'))
      .catch(() => prompt('Copy text:', text));
  } else {
    prompt('Copy text:', text);
  }
}

render();
</script>
</body>
</html>
