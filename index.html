<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGER Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #03052f;
  color: white;
  min-height: 100vh;
}

.login-page {
  min-height: 100vh;
  position: relative;
  padding: 20px 24px;
}

.logo {
  position: absolute;
  top: 15%;
  left: 0;
  width: 100%;
  text-align: center;
  color: #13c900;
}

.dice {
  font-size: 125px;
  line-height: 1.2;
  margin-bottom: 15px;
}

.logo h1 {
  margin: 0;
  font-family: Impact, sans-serif;
  font-size: clamp(65px, 17vw, 110px);
  font-weight: normal;
  letter-spacing: 1px;
}

.login-form {
  position: absolute;
  bottom: 7%;
  left: 24px;
  right: 24px;
}

input {
  display: block;
  width: 100%;
  height: 72px;
  border: none;
  outline: none;
  border-radius: 24px;
  padding: 0 16px;
  font-size: 27px;
  font-weight: bold;
  background: #fff;
  color: #111;
  margin-bottom: 23px;
}

button {
  width: 100%;
  height: 72px;
  border: none;
  border-radius: 24px;
  background: #14c000;
  color: white;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  opacity: 0.8;
}

#error {
  color: #ff7777;
  text-align: center;
  margin: 0 0 12px;
  font-size: 16px;
}

#dashboard {
  display: none;
  padding: 25px;
}

#dashboard h1 {
  color: #16d000;
  text-align: center;
}

.menu {
  margin-top: 30px;
  padding: 20px;
  border-radius: 12px;
  background: #101446;
  font-size: 19px;
}

.menu button {
  margin-top: 15px;
  height: 55px;
  font-size: 17px;
  border-radius: 12px;
}

@media (max-height: 650px) {
  .logo { top: 7%; }
  .dice { font-size: 75px; }
  .logo h1 { font-size: 65px; }
  .login-form { bottom: 4%; }
  input, button { height: 58px; }
}
</style>
</head>

<body>

<div class="login-page" id="loginPage">

  <div class="logo">
    <div class="dice">🎲🎲</div>
    <h1>LEDGER</h1>
  </div>

  <form class="login-form" id="loginForm">
    <input
      type="password"
      id="passcode"
      placeholder="Passcode"
      inputmode="numeric"
      autocomplete="off"
      aria-label="Passcode"
      required
    >

    <p id="error" role="alert"></p>

    <button type="submit">PROCEED</button>
  </form>

</div>

<div id="dashboard">
  <h1>LEDGER</h1>

  <div class="menu">
    <h2>Welcome</h2>
    <p>Login successful!</p>
    <p>Your Ledger page is open.</p>

    <button onclick="logout()">LOGOUT</button>
  </div>
</div>

<script>
const correctPasscode = "8941";

document.getElementById("loginForm")
.addEventListener("submit", function(event) {
  event.preventDefault();

  const enteredPasscode =
    document.getElementById("passcode").value;

  if (enteredPasscode === correctPasscode) {
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    document.getElementById("error").textContent = "";
  } else {
    document.getElementById("error").textContent =
      "Wrong Passcode! Please try again.";

    document.getElementById("passcode").value = "";
    document.getElementById("passcode").focus();
  }
});

function logout() {
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("loginPage").style.display = "block";
  document.getElementById("passcode").value = "";
}
</script>

</body>
</html><!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Total Calculator</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  padding: 15px;
  margin: 0;
}
.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 2px 10px #ccc;
}
h2 { text-align: center; color: #123b68; }
textarea {
  width: 100%;
  height: 310px;
  box-sizing: border-box;
  padding: 12px;
  font-size: 15px;
  border: 1px solid #aaa;
  border-radius: 8px;
}
button {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: none;
  border-radius: 7px;
  font-size: 17px;
  color: white;
  background: #1769aa;
}
.result {
  background: #e8f5e9;
  padding: 12px;
  border-radius: 8px;
  margin-top: 15px;
  overflow-wrap: anywhere;
}
.line { border-bottom: 1px solid #ddd; padding: 8px 0; }
.total { font-size: 22px; font-weight: bold; color: #08752c; }
</style>
</head>
<body>
<div class="container">
<h2>Number Total Calculator</h2>

<p>हर लाइन में नंबर लिखें और आखिरी में (वैल्यू) लगाएँ।</p>

<textarea id="data">03(10
13(25
23 33 43 53 63 73 83 93(25
14(450
41(20
28(350
20 21 23 24 25 26 27 29(25
79(100
82(750
04(400
66(130
73(50
51(130
44(300
29 68 92(30
45(720
45(200
02 03 07 08 10 13 15 16 17 19 20 24 28 29 30 31 32 34 35 36 37 38 39 40 43 44 45 46 47 48 49 50 52 53 54 56 57 58 59 63 64 67 68 69 71 72 73 78 81 82 84 86 89 90 91 92 93 94 95 97 98 99(25)</textarea>

<button onclick="calculate()">Calculate Total</button>
<button onclick="copyResult()" style="background:#16804a">Copy Result</button>

<div id="result" class="result">
हिसाब देखने के लिए Calculate Total दबाएँ।
</div>
</div>

<script>
function calculate() {
  const input = document.getElementById("data").value;
  const lines = input.split(/\n/);
  let grandTotal = 0;
  let output = "";
  let validLines = 0;

  lines.forEach((line, index) => {
    line = line.trim();
    if (!line) return;

    // Bracket se pehle numbers aur baad ki value
    const match = line.match(/^(.*?)\s*\(\s*(\d+)\s*\)?\s*$/);
    if (!match) {
      output += `<div class="line">${index + 1}. गलत फॉर्मेट: ${line}</div>`;
      return;
    }

    const numbersText = match[1].trim();
    const value = Number(match[2]);
    const numbers = numbersText.match(/\d+/g);

    if (!numbers || numbersText.replace(/[\d\s.,]+/g, "").length) {
      output += `<div class="line">${line} — नंबर जाँचें</div>`;
      return;
    }

    const count = numbers.length;
    const total = count * value;
    grandTotal += total;
    validLines++;

    output += `<div class="line">
      ${numbers.join(" ")} (${value})<br>
      ${count} × ${value} = <b>${total.toLocaleString("en-IN")}</b>
    </div>`;
  });

  output += `<p>कुल सही लाइनें: ${validLines}</p>
    <div class="total">Grand Total = ${grandTotal.toLocaleString("en-IN")}</div>`;

  document.getElementById("result").innerHTML = output;
}

function copyResult() {
  const text = document.getElementById("result").innerText;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(
      () => alert("Result copied!"),
      () => fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const area = document.createElement("textarea");
  area.value = text;
  document.body.appendChild(area);
  area.select();
  try {
    document.execCommand("copy");
    alert("Result copied!");
  } catch (e) {
    alert("Copy नहीं हुआ। Result को manually select करें।");
  }
  area.remove();
}
</script>
</body>
</html>
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Count Calculator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f4f9;
  padding: 20px;
}
.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 10px #ccc;
}
h2 {
  text-align: center;
  color: #174ea6;
}
textarea, button {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 10px;
  font-size: 16px;
  border-radius: 7px;
}
textarea {
  height: 130px;
  border: 1px solid #aaa;
}
button {
  border: none;
  background: #1769e0;
  color: white;
  font-weight: bold;
}
.result {
  margin-top: 18px;
  padding: 15px;
  background: #e8f5e9;
  border-radius: 8px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 18px;
}
</style>
</head>

<body>
<div class="container">
  <h2>Number Count Calculator</h2>

  <textarea id="data"
    placeholder="यहाँ अपना टेक्स्ट डालें&#10;Example: 23,45.56:55;78/79=67_99 34(10)"></textarea>

  <button onclick="calculate()">Calculate Total</button>
  <button onclick="clearAll()" style="background:#d93025">
    Clear
  </button>

  <div class="result" id="result">Result यहाँ दिखेगा</div>
</div>

<script>
function calculate() {
  const text = document.getElementById("data").value;
  const result = document.getElementById("result");

  // ब्रैकेट से पहले का टेक्स्ट और ब्रैकेट की वैल्यू
  const regex = /([^()]*?)\(\s*(\d+)\s*\)/g;
  let match;
  let output = [];
  let grandTotal = 0;
  let found = false;

  while ((match = regex.exec(text)) !== null) {
    found = true;

    // ब्रैकेट से पहले के सभी 1 या अधिक अंकों वाले नंबर
    const numbers = match[1].match(/\d+/g) || [];
    const multiplier = Number(match[2]);
    const count = numbers.length;
    const total = count * multiplier;

    output.push(
      "नंबर: " + (numbers.join(", ") || "कोई नंबर नहीं") +
      "\nकुल नंबर = " + count +
      "\n" + count + " × " + multiplier + " = " + total
    );

    grandTotal += total;
  }

  if (!found) {
    result.textContent =
      "ब्रैकेट की वैल्यू नहीं मिली। उदाहरण: 23,45,56(10)";
    return;
  }

  output.push("कुल टोटल = " + grandTotal);
  result.textContent = output.join("\n\n");
}

function clearAll() {
  document.getElementById("data").value = "";
  document.getElementById("result").textContent =
    "Result यहाँ दिखेगा";
}
</script>
</body>
</html>
